<div class="card w-full max-w-md rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <div class="mb-4 flex justify-center">
        <app-logo />
    </div>
    @if (title) {
        <h1 class="mb-4 text-2xl flex justify-center font-semibold text-gray-800">
            {{ title }}
        </h1>
    }
    <ng-content />

    @if (footerText && footerRoute) {
        <a class="footerText text-blue-600 hover:text-blue-800 hover:underline" routerLink="{{footerRoute}}">{{ footerText }} </a>
    } @else if (footerText) {
        <p class="footerText">{{footerText}}</p>
    }
</div>
